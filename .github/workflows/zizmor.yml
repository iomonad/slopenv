name: zizmor

on:
  push:
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  schedule:
    # Mondays 04:17 UTC: off the top of the hour, when everyone else's cron fires
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          persona: regular
          min-severity: low
          advanced-security: false
          annotations: true
